services:
  sabrina:
    container_name: sabrina
    image: sabrina:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=PROD
      - LOG_FILE=/app/logs/sabrina.log
    env_file:
      - .env
    volumes:
      - ./downloads/youtube:/app/downloads/youtube
      - ./sabrina.db:/app/sabrina.db
      - ./logs:/app/logs
