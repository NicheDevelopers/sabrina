name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, lint and types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: npm run docker:build
